<!-- Supabase Browser Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "यहाँ अपना सही Project URL डालें";
const SUPABASE_PUBLISHABLE_KEY = "यहाँ अपनी Publishable Key डालें";

const message = document.getElementById("authMessage");
const signupBtn = document.getElementById("signupBtn");
const loginBtn = document.getElementById("loginBtn");

let supabaseClient = null;

function showMessage(text) {
  message.textContent = text;
}

try {
  if (!window.supabase) {
    showMessage("Supabase Library लोड नहीं हुई।");
  } else if (
    !SUPABASE_URL.startsWith("https://") ||
    !SUPABASE_URL.endsWith(".supabase.co") ||
    !SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_")
  ) {
    showMessage("Project URL या Publishable Key गलत है।");
  } else {
    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );
    showMessage("CITY SAATHI तैयार है। अब Signup या Login करें।");
  }
} catch (error) {
  showMessage("Setup Error: " + error.message);
}

signupBtn.addEventListener("click", async function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!supabaseClient) {
    showMessage("Supabase सेटिंग जाँचें।");
    return;
  }

  if (!email || password.length < 6) {
    showMessage("सही Email और कम से कम 6 अक्षर का Password भरें।");
    return;
  }

  signupBtn.disabled = true;
  showMessage("Account बनाया जा रहा है...");

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password
    });

    if (error) {
      showMessage("Signup Error: " + error.message);
    } else if (data.session) {
      showMessage("अकाउंट बन गया और Login हो गया!");
    } else {
      showMessage("अकाउंट बनाने की प्रक्रिया सफल! Email चेक करें।");
    }
  } catch (error) {
    showMessage("Error: " + error.message);
  } finally {
    signupBtn.disabled = false;
  }
});

loginBtn.addEventListener("click", async function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!supabaseClient) {
    showMessage("Supabase सेटिंग जाँचें।");
    return;
  }

  if (!email || !password) {
    showMessage("Email और Password भरें।");
    return;
  }

  loginBtn.disabled = true;
  showMessage("Login हो रहा है...");

  try {
    const { error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showMessage("Login Error: " + error.message);
    } else {
      showMessage("Login सफल हो गया!");
    }
  } catch (error) {
    showMessage("Error: " + error.message);
  } finally {
    loginBtn.disabled = false;
  }
});
</script>
</body>
</html>
